name: Vendor Poly Haven game assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/vendor-polyhaven-assets.mjs'
      - 'scripts/vendor-polyhaven-rifle.mjs'
      - 'src/main.js'
      - '.github/workflows/vendor-polyhaven-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-polyhaven-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install glTF optimization tools
        run: npm install --global @gltf-transform/cli@4.5.1
      - name: Download, optimize, and vendor Pine Forest models
        run: node scripts/vendor-polyhaven-assets.mjs
      - name: Download CC0 Poly Haven sky HDRI
        run: |
          mkdir -p public/assets/hdri
          curl --fail --location --retry 3 --output public/assets/hdri/qwantani_mid_morning_puresky_2k.hdr https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/qwantani_mid_morning_puresky_2k.hdr
          test -s public/assets/hdri/qwantani_mid_morning_puresky_2k.hdr
      - name: Download and optimize the single bolt-action rifle
        run: node scripts/vendor-polyhaven-rifle.mjs
      - name: Commit vendored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/polyhaven public/assets/hdri public/assets/weapons
          if git diff --cached --quiet; then
            echo "Assets already up to date"
          else
            git commit -m "Vendor Poly Haven models and textures"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after rebasing"
              sleep $((attempt * 5))
            done
            echo "Could not push vendored assets after three attempts"
            exit 1
          fi
